name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate SonarCloud CI variables
        run: |
          test -n "${SONAR_TOKEN}" || (echo "Missing SONAR_TOKEN secret" && exit 1)
          test -n "${SONAR_ORGANIZATION}" || (echo "Missing SONAR_ORGANIZATION variable" && exit 1)
          test -n "${SONAR_PROJECT_KEY}" || (echo "Missing SONAR_PROJECT_KEY variable" && exit 1)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run linter (Checkstyle)
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest

      - name: Run tests and coverage report
        run: ./gradlew --no-daemon test jacocoTestReport

      - name: SonarCloud analysis
        run: ./gradlew --no-daemon sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

      - name: SonarCloud quality gate
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        with:
          scanMetadataReportFile: build/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail if quality gate is not passed
        if: steps.quality-gate.outputs.quality-gate-status != 'PASSED'
        run: |
          echo "SonarCloud quality gate failed: ${{ steps.quality-gate.outputs.quality-gate-status }}"
          exit 1
